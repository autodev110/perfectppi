name: Ship iOS to TestFlight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile

      - name: Type-check and test
        run: |
          pnpm run typecheck
          pnpm run test:unit

  testflight:
    name: Archive and upload iOS
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 75
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps/6806023496/testflight/ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      APPLE_TEAM_ID: 79P499H2M4
      IOS_BUNDLE_ID: com.perfectppi.app
      IOS_PROJECT: mobile-app/PerfectPPI.xcodeproj
      IOS_SCHEME: PerfectPPI
      IOS_API_BASE_URL: ${{ vars.IOS_API_BASE_URL || 'https://perfectppi.vercel.app' }}
      IOS_SUPABASE_URL: ${{ secrets.IOS_SUPABASE_URL }}
      IOS_SUPABASE_ANON_KEY: ${{ secrets.IOS_SUPABASE_ANON_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release configuration
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in IOS_API_BASE_URL IOS_SUPABASE_URL IOS_SUPABASE_ANON_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing TestFlight environment value: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          if [[ "$IOS_API_BASE_URL" != https://* || "$IOS_SUPABASE_URL" != https://* ]]; then
            echo "::error::The iOS API and Supabase URLs must use HTTPS."
            exit 1
          fi

          private_key_dir="$RUNNER_TEMP/app-store-connect"
          auth_key_path="$private_key_dir/AuthKey_${ASC_KEY_ID}.p8"
          install -d -m 700 "$private_key_dir"
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$auth_key_path"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid .p8 private key."
            exit 1
          fi
          echo "AUTH_KEY_PATH=$auth_key_path" >> "$GITHUB_ENV"

      - name: Select release build number
        run: |
          build_number="$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "TestFlight build number: $build_number"

      - name: Configure local distribution signing
        env:
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          DISTRIBUTION_PROFILE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in DISTRIBUTION_CERTIFICATE_BASE64 DISTRIBUTION_CERTIFICATE_PASSWORD DISTRIBUTION_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing local distribution-signing value: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          profile_path="$RUNNER_TEMP/perfectppi-app-store.mobileprovision"
          profile_plist="$RUNNER_TEMP/perfectppi-app-store-profile.plist"
          keychain_path="$RUNNER_TEMP/testflight-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          umask 077
          printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" \
            | tr -d '\r\n' \
            | /usr/bin/base64 --decode \
            > "$certificate_path"
          printf '%s' "$DISTRIBUTION_PROFILE_BASE64" \
            | tr -d '\r\n' \
            | /usr/bin/base64 --decode \
            > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path"

          security cms -D -i "$profile_path" -o "$profile_plist"
          profile_name="$(plutil -extract Name raw "$profile_plist")"
          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          profile_team="$(plutil -extract TeamIdentifier.0 raw "$profile_plist")"
          profile_app_id="$(plutil -extract Entitlements.application-identifier raw "$profile_plist")"
          profile_is_beta="$(plutil -extract Entitlements.beta-reports-active raw "$profile_plist")"
          profile_is_debug="$(plutil -extract Entitlements.get-task-allow raw "$profile_plist")"
          profile_expiration="$(plutil -extract ExpirationDate raw "$profile_plist")"

          if [[ "$profile_team" != "$APPLE_TEAM_ID" || "$profile_app_id" != "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]; then
            echo "::error::The provisioning profile belongs to an unexpected team or bundle ID."
            exit 1
          fi
          if [[ "$profile_is_beta" != "true" || "$profile_is_debug" != "false" ]]; then
            echo "::error::The provisioning profile is not an App Store distribution profile."
            exit 1
          fi

          expiration_epoch="$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$profile_expiration" '+%s')"
          if (( expiration_epoch <= $(date -u '+%s') )); then
            echo "::error::The App Store provisioning profile has expired."
            exit 1
          fi

          profile_matches_certificate=0
          profile_certificate_count="$(plutil -extract DeveloperCertificates raw "$profile_plist")"
          for ((index = 0; index < profile_certificate_count; index++)); do
            encoded_certificate="$RUNNER_TEMP/profile-certificate-$index.b64"
            profile_certificate="$RUNNER_TEMP/profile-certificate-$index.cer"
            plutil \
              -extract "DeveloperCertificates.$index" \
              raw \
              -o "$encoded_certificate" \
              "$profile_plist"
            /usr/bin/base64 --decode \
              < "$encoded_certificate" \
              > "$profile_certificate"
            fingerprint="$(
              openssl x509 \
                -inform DER \
                -in "$profile_certificate" \
                -noout \
                -fingerprint \
                -sha1 \
                | cut -d= -f2 \
                | tr -d ':'
            )"
            if security find-identity -v -p codesigning "$keychain_path" | grep -Fq "$fingerprint"; then
              profile_matches_certificate=1
              break
            fi
          done
          if [[ "$profile_matches_certificate" -ne 1 ]]; then
            echo "::error::The provisioning profile does not include the supplied distribution certificate."
            exit 1
          fi

          legacy_profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          install -d -m 700 "$legacy_profile_dir" "$xcode_profile_dir"
          legacy_profile_path="$legacy_profile_dir/$profile_uuid.mobileprovision"
          xcode_profile_path="$xcode_profile_dir/$profile_uuid.mobileprovision"
          install -m 600 "$profile_path" "$legacy_profile_path"
          install -m 600 "$profile_path" "$xcode_profile_path"

          rm -f "$certificate_path"
          {
            echo "SIGNING_KEYCHAIN=$keychain_path"
            echo "PROVISIONING_PROFILE_NAME=$profile_name"
            echo "PROVISIONING_PROFILE_UUID=$profile_uuid"
            echo "LEGACY_PROVISIONING_PROFILE_PATH=$legacy_profile_path"
            echo "XCODE_PROVISIONING_PROFILE_PATH=$xcode_profile_path"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen --version

      - name: Generate client-safe app configuration and Xcode project
        run: |
          cp mobile-app/PerfectPPI/Resources/AppConfig.example.plist \
            mobile-app/PerfectPPI/Resources/AppConfig.plist
          touch mobile-app/.env

          package_lock="$IOS_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          [[ -s "$package_lock" ]]
          cp "$package_lock" "$RUNNER_TEMP/Package.resolved.locked"

          (
            cd mobile-app
            SUPABASE_URL="$IOS_SUPABASE_URL" \
            SUPABASE_ANON_KEY="$IOS_SUPABASE_ANON_KEY" \
            API_BASE_URL="$IOS_API_BASE_URL" \
              ./configure.sh
            xcodegen generate
          )

          cmp "$RUNNER_TEMP/Package.resolved.locked" "$package_lock"

          app_config="mobile-app/PerfectPPI/Resources/AppConfig.plist"
          [[ "$(plutil -extract APIBaseURL raw "$app_config")" == "$IOS_API_BASE_URL" ]]
          [[ "$(plutil -extract SupabaseURL raw "$app_config")" == "$IOS_SUPABASE_URL" ]]
          [[ "$(plutil -extract SupabaseAnonKey raw "$app_config")" == "$IOS_SUPABASE_ANON_KEY" ]]
          if grep -Eq 'YOUR-|localhost|127\.0\.0\.1' "$app_config"; then
            echo "::error::Generated AppConfig.plist contains a placeholder or local endpoint."
            exit 1
          fi

      - name: Resolve locked Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -onlyUsePackageVersionsFromResolvedFile

          cmp \
            "$RUNNER_TEMP/Package.resolved.locked" \
            "$IOS_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

      - name: Run iOS unit tests
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty'
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "::error::No available iPhone simulator was found on the runner."
            exit 1
          fi

          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:PerfectPPITests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive the production app
        run: |
          archive_path="$RUNNER_TEMP/PerfectPPI-${BUILD_NUMBER}.xcarchive"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

          xcodebuild \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            clean archive

      - name: Verify the archive before upload
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/PerfectPPI.app"
          info_plist="$app_path/Info.plist"
          app_config="$app_path/AppConfig.plist"

          [[ -d "$app_path" ]]
          [[ "$(plutil -extract CFBundleIdentifier raw "$info_plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(plutil -extract CFBundleVersion raw "$info_plist")" == "$BUILD_NUMBER" ]]
          [[ "$(plutil -extract APIBaseURL raw "$app_config")" == "$IOS_API_BASE_URL" ]]
          [[ "$(plutil -extract SupabaseURL raw "$app_config")" == "$IOS_SUPABASE_URL" ]]
          [[ "$(plutil -extract SupabaseAnonKey raw "$app_config")" == "$IOS_SUPABASE_ANON_KEY" ]]

          signing_metadata="$(codesign -dvv "$app_path" 2>&1)"
          if ! grep -Fxq "Identifier=$IOS_BUNDLE_ID" <<< "$signing_metadata"; then
            echo "::error::The archive was signed with an unexpected bundle identifier."
            exit 1
          fi
          if ! grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signing_metadata"; then
            echo "::error::The archive was signed by an unexpected Apple team."
            exit 1
          fi

          version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
          echo "Verified $IOS_BUNDLE_ID version $version ($BUILD_NUMBER)."
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        run: |
          export_path="$RUNNER_TEMP/TestFlightExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist mobile-app/ExportOptions-TestFlight.plist \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          {
            echo "## TestFlight upload accepted"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$MARKETING_VERSION ($BUILD_NUMBER)\`"
            echo "- Bundle: \`$IOS_BUNDLE_ID\`"
            echo "- Apple will process the build before TestFlight displays it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials and generated files
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/apple-distribution.p12"
          rm -f "${LEGACY_PROVISIONING_PROFILE_PATH:-}"
          rm -f "${XCODE_PROVISIONING_PROFILE_PATH:-}"
          rm -rf "$RUNNER_TEMP/app-store-connect"
          rm -f mobile-app/.env
          rm -f mobile-app/PerfectPPI/Resources/AppConfig.plist
          rm -rf mobile-app/PerfectPPI.xcodeproj
