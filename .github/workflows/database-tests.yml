name: Supabase Database Tests

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Fresh migration and SQL suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: local-ci-google-client
      GOOGLE_CLIENT_SECRET: local-ci-google-secret
      APPLE_SIGN_IN_CLIENT_ID: com.perfectppi.local-ci
      APPLE_SIGN_IN_WEB_SECRET: local-ci-apple-secret
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Apply every migration to a fresh database
        run: supabase db start

      - name: Run rollback-only database tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.test.sql; do
            echo "Running $test_file"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done
